<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Color Models</h1>

    <section>
        <h2>Color Formats</h2>

        <div class="named-color">
            <p>Named color: tomato</p>
        </div>

        <div class="hex-color">
            <p>HEX color: #4169E1</p>
        </div>

        <div class="rgb-color">
            <p>RGB color: rgb(60, 179, 113)</p>
        </div>

        <div class="rgba-color">
            <p>RGBA color: rgba(255, 140, 0, 0.5)</p>
        </div>
    </section>

    <section>
        <h2>Opacity Compared with RGBA</h2>

        <div class="opacity-box">
            <p>Opacity: 0.5</p>
            <strong>This text also becomes transparent.</strong>
        </div>

        <div class="rgba-box">
            <p>RGBA background with alpha 0.5</p>
            <strong>This text remains fully opaque.</strong>
        </div>
    </section>

</body>
</html>
