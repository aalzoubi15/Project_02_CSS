<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="nav-container">
        <h1>My Website</h1>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#cards">Cards</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <main id="home">
        <h2>My Cards</h2>

        <section class="card-container" id="cards">
            <article class="card">
                <h3>HTML</h3>
                <p>HTML gives a webpage its structure.</p>
            </article>

            <article class="card">
                <h3>CSS</h3>
                <p>CSS controls the appearance of a webpage.</p>
            </article>

            <article class="card">
                <h3>JavaScript</h3>
                <p>JavaScript adds behavior to a webpage.</p>
            </article>

            <article class="card">
                <h3>Flexbox</h3>
                <p>Flexbox helps arrange elements in a layout.</p>
            </article>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>This page demonstrates a navigation bar and card grid.</p>
        </section>
    </main>

</body>
</html>
