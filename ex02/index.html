<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shapes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Shapes</h1>

    <section>
        <h2>Square</h2>
        <div class="square"></div>
    </section>

    <section>
        <h2>Rectangle</h2>
        <div class="rectangle"></div>
    </section>

    <section>
        <h2>Circle</h2>
        <div class="circle"></div>
    </section>

    <section>
        <h2>Capsule or Pill</h2>
        <div class="pill"></div>
    </section>

    <section>
        <h2>Triangle</h2>
        <div class="triangle"></div>
    </section>

</body>
</html>
